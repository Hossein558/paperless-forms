name: Test Plugin - Jira 11.3.7

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-jira-11:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: System info
        run: |
          echo "Ubuntu: $(lsb_release -rs)"
          echo "Kernel: $(uname -r)"
      
      - name: Download Jira 11.3.7
        run: |
          wget -q https://product-downloads.atlassian.com/software/jira/downloads/atlassian-jira-software-11.3.7-x64.bin
          chmod +x atlassian-jira-software-11.3.7-x64.bin
          ls -lh *.bin
      
      - name: Install Jira
        run: |
          sudo ./atlassian-jira-software-11.3.7-x64.bin -q
      
      - name: Verify installation
        run: |
          sudo systemctl status jira || true
          ls -la /opt/atlassian/ || true

      - name: Deploy Plugin JAR via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "target/*.jar"
          target: "/home/github/paperless-forms/paperless-forms-plugin/"
          strip_components: 0
